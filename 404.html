<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>页面不存在 · tools.drytron.net</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%23d9541e'/%3E%3Ctext%20x='32'%20y='45'%20font-size='36'%20fill='%23ffffff'%20font-family='sans-serif'%20text-anchor='middle'%3EQ%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://tools.drytron.net/tools/3lsolve/styles.css">
<script src="https://tools.drytron.net/tools/3lsolve/theme-init.js"></script>
<style>
.nf-wrap{min-height:100vh;display:grid;align-content:center;max-width:720px;margin:0 auto;padding:48px 22px}
.nf-card{padding:34px 34px 30px}
.nf-kicker{font-size:10.5px;font-weight:600;letter-spacing:.12em;color:var(--muted);margin:0 0 16px}
.nf-code{font-size:clamp(64px,14vw,104px);line-height:.9;font-weight:800;letter-spacing:-.045em;color:var(--accent);margin:0 0 14px;font-variant-numeric:tabular-nums}
.nf-card h1{font-size:clamp(22px,4vw,30px);line-height:1.25;margin:0 0 10px;letter-spacing:-.01em}
.nf-desc{color:var(--muted);font-size:13.5px;line-height:1.8;margin:0 0 22px;max-width:46ch}
.nf-actions{display:flex;flex-wrap:wrap;gap:8px}
.nf-btn{display:inline-flex;align-items:center;justify-content:center;border-radius:6px;padding:9px 16px;font-size:13px;font-weight:600;text-decoration:none;transition:background .14s,border-color .14s,color .14s}
.nf-btn.primary{background:var(--accent);border:1px solid var(--accent);color:var(--on-accent)}
.nf-btn.primary:hover{background:color-mix(in oklab,var(--accent) 88%,var(--ink))}
.nf-btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--ink)}
.nf-btn.ghost:hover{border-color:var(--line-strong);background:var(--sunk)}
.nf-note{margin:22px 0 0;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px;line-height:1.7}
@media (max-width:560px){.nf-wrap{padding:28px 16px}.nf-card{padding:28px 20px 24px}.nf-actions .nf-btn{width:100%}}
</style>
</head>
<body>
<main class="nf-wrap">
  <div class="card nf-card">
    <p class="nf-kicker">tools.drytron.net</p>
    <p class="nf-code">404</p>
    <h1>这个页面不存在</h1>
    <p class="nf-desc">可能是链接写错了，或者内容已经搬走。</p>
    <div class="nf-actions">
      <a class="nf-btn primary" href="/main/">回到攻略首页</a>
      <a class="nf-btn ghost" href="/tools/3lsolve/">打开套装求解器</a>
    </div>
    <p class="nf-note">如果是从旧链接进来的，回首页重新找一下；也可以直接用上面的求解器。</p>
  </div>
</main>
</body>
</html>
